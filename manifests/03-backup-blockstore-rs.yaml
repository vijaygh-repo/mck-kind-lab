apiVersion: mongodb.com/v1
kind: MongoDB
metadata:
  name: blockstore-rs
  namespace: mongodb
spec:
  credentials: my-credentials
  opsManager:
    configMapRef:
      name: my-project
  members: 1
  version: 7.0.14-ent
  type: ReplicaSet
  persistent: true
  podSpec:
    persistence:
      single:
        storage: 10Gi
