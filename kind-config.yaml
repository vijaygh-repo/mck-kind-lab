kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mck-lab
nodes:
  - role: control-plane
    extraPortMappings:
      # Ops Manager UI: host:8080 -> NodePort 30080 inside the cluster
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
